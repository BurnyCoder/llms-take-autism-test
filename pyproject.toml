[project]
name = "llms-take-autism-test"
version = "0.1.0"
description = "Pilot benchmark for having LLMs answer Autism Spectrum Quotient items"
readme = "README.md"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
]

[project.scripts]
llms-take-autism-test = "llms_take_autism_test.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
